<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 348" width="730" height="348" font-family="&#x27;Source Sans Pro&#x27;, &#x27;Source Sans 3&#x27;, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Roboto, Arial, sans-serif"><rect x="14.4" y="11.52" width="700.8" height="89.71" fill="#FFFFFF" stroke="#D7D1C4" stroke-width="1.00"/><rect x="14.4" y="11.52" width="6.72" height="89.71" fill="#1E2D3C"/><text x="35.52" y="33.12" fill="#6E7882" font-size="13.33" font-family="Menlo, Consolas, &#x27;DejaVu Sans Mono&#x27;, monospace" font-weight="700" xml:space="preserve">analyse.qmd</text><text x="35.52" y="63.39" fill="#1E2D3C" font-size="13.33" font-family="Menlo, Consolas, &#x27;DejaVu Sans Mono&#x27;, monospace" font-weight="700" xml:space="preserve">Wie @Goodman2016 zeigt, lässt sich Reproduzierbarkeit unterschiedlich definieren.</text><text x="35.52" y="82.32" fill="#1E2D3C" font-size="13.33" font-family="Menlo, Consolas, &#x27;DejaVu Sans Mono&#x27;, monospace" font-weight="700" xml:space="preserve">Für eine ausführliche Behandlung siehe auch [@Wickham2023].</text><rect x="14.4" y="115.2" width="220.8" height="165.44" fill="#FFFFFF" stroke="#D7D1C4" stroke-width="1.00"/><rect x="14.4" y="115.2" width="6.72" height="165.44" fill="#1E2D3C"/><text x="35.52" y="136.8" fill="#6E7882" font-size="13.33" font-family="Menlo, Consolas, &#x27;DejaVu Sans Mono&#x27;, monospace" font-weight="700" xml:space="preserve">literatur.bib</text><text x="35.52" y="167.07" fill="#1E2D3C" font-size="13.33" font-family="Menlo, Consolas, &#x27;DejaVu Sans Mono&#x27;, monospace" font-weight="700" xml:space="preserve">@article{Goodman2016,</text><text x="35.52" y="186" fill="#1E2D3C" font-size="13.33" font-family="Menlo, Consolas, &#x27;DejaVu Sans Mono&#x27;, monospace" font-weight="700" xml:space="preserve">  …</text><text x="35.52" y="204.93" fill="#1E2D3C" font-size="13.33" font-family="Menlo, Consolas, &#x27;DejaVu Sans Mono&#x27;, monospace" font-weight="700" xml:space="preserve">}</text><text x="35.52" y="223.87" fill="#1E2D3C" font-size="13.33" font-family="Menlo, Consolas, &#x27;DejaVu Sans Mono&#x27;, monospace" font-weight="700" xml:space="preserve">@book{Wickham2023,</text><text x="35.52" y="242.8" fill="#1E2D3C" font-size="13.33" font-family="Menlo, Consolas, &#x27;DejaVu Sans Mono&#x27;, monospace" font-weight="700" xml:space="preserve">  …</text><text x="35.52" y="261.73" fill="#1E2D3C" font-size="13.33" font-family="Menlo, Consolas, &#x27;DejaVu Sans Mono&#x27;, monospace" font-weight="700" xml:space="preserve">}</text><text x="278.4" y="197.88" text-anchor="middle" fill="#1E2D3C" font-size="14.00" font-weight="700" xml:space="preserve">Render</text><polygon points="253.44,218.88 288,218.88 288,212.16 301.44,225.6 288,239.04 288,232.32 253.44,232.32" fill="#6E7882"/><rect x="318.72" y="115.2" width="396.48" height="220.8" fill="#FFFFFF" stroke="#D7D1C4" stroke-width="1.33"/><text x="333.12" y="139.74" fill="#1E2D3C" font-size="14.00" xml:space="preserve">Wie Goodman, Fanelli, und Ioannidis (2016) zeigt, lässt</text><text x="333.12" y="157.38" fill="#1E2D3C" font-size="14.00" xml:space="preserve">sich Reproduzierbarkeit unterschiedlich definieren. Für</text><text x="333.12" y="175.02" fill="#1E2D3C" font-size="14.00" xml:space="preserve">eine ausführliche Behandlung siehe auch (Wickham und</text><text x="333.12" y="192.66" fill="#1E2D3C" font-size="14.00" xml:space="preserve">Grolemund 2023).</text><text x="333.12" y="221.01" fill="#1E2D3C" font-size="16.00" font-weight="700" xml:space="preserve">Literatur</text><text x="333.12" y="242.21" fill="#1E2D3C" font-size="13.33" xml:space="preserve">Goodman, Steven N., Daniele Fanelli, und John P. A.</text><text x="333.12" y="259.01" fill="#1E2D3C" font-size="13.33" xml:space="preserve">Ioannidis. 2016. „What does research reproducibility</text><text x="333.12" y="275.81" xml:space="preserve"><tspan fill="#1E2D3C" font-size="13.33">mean?“ </tspan><tspan fill="#1E2D3C" font-size="13.33" font-style="italic">Science Translational Medicine</tspan><tspan fill="#1E2D3C" font-size="13.33"> 8 (341): 341ps12.</tspan></text><text x="333.12" y="297.95" xml:space="preserve"><tspan fill="#1E2D3C" font-size="13.33">Wickham, Hadley, und Garrett Grolemund. 2023. </tspan><tspan fill="#1E2D3C" font-size="13.33" font-style="italic">R for Data</tspan></text><text x="333.12" y="314.75" xml:space="preserve"><tspan fill="#1E2D3C" font-size="13.33" font-style="italic">Science</tspan><tspan fill="#1E2D3C" font-size="13.33">. 2. Aufl. O’Reilly.</tspan></text></svg>
