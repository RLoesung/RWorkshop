# Gemeinsame Einstellungen für beide Sprachen.
# Sprachspezifisches steht in _quarto-de.yml (Standard) und _quarto-en.yml.
# Listen (z. B. Kapitel) stehen nur in den Profilen: Quarto hängt Listen beim Zusammenführen aneinander.
project:
  type: book

profile:
  default: de

book:
  author:
    - "Yannick Diehl"
    - "Daniel Moosdorf"
  date: today
  search: true
  reader-mode: true
  repo-url: https://github.com/RLoesung/RWorkshop
  repo-actions: [edit, source, issue]
  sidebar:
    style: docked
    collapse-level: 1

format:
  html:
    # Design „Baukasten“: begleiter.scss erzeugt figuren/begleiter.py, seite.html setzt Kapitelfarben und Kästen
    theme: [cosmo, begleiter.scss, theme.scss, zusatz.scss]
    include-after-body: seite.html
    code-copy: true
    code-link: true
    code-overflow: wrap
    code-tools: false
    toc: true
    toc-depth: 4
    toc-location: right
    toc-expand: false
    number-sections: true
    fig-align: center
    fig-cap-location: bottom
    smooth-scroll: true

execute:
  echo: true
  warning: false
  message: false
  freeze: auto

knitr:
  opts_chunk:
    dpi: 150
    fig.align: center
    out.width: "90%"
