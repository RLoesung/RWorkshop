project:
  type: book
  output-dir: docs

book:
  title: "R Workshop – Sozialwissenschaften"
  subtitle: "Einführung in die statistische Datenanalyse mit tidyverse und mariposa"
  author:
    - "Yannick Diehl"
    - "Daniel Moosdorf"
  date: today
  date-format: "DD.MM.YYYY"
  language: de
  search: true
  cover-image: Bilder/cover.svg
  cover-image-alt: "Drei Türme aus Bausteinen auf einer Bauplatte, daneben eine Begleitfigur"
  reader-mode: true
  page-footer:
    left: "R Workshop – Sozialwissenschaften · Yannick Diehl und Daniel Moosdorf"
    right: "Gebaut mit [Quarto](https://quarto.org/)"
  repo-url: https://github.com/RLoesung/RWorkshop
  repo-actions: [edit, source, issue]
  sidebar:
    style: docked
    collapse-level: 1
  chapters:
    - href: index.qmd
      text: "0  Vorwort"
    - 01-RStudio.qmd
    - 02-Quarto.qmd
    - 03-ProgrammierspracheR.qmd
    - 04-Datenimport.qmd
    - 05-Datentransformation.qmd
    - 06-Grafiken-Grundlagen.qmd
    - 07-Uni-Bivariate-Analyse.qmd
    - 08-Latente-Strukturen.qmd
    - 09-Erklaerungsmodelle.qmd

format:
  html:
    # Design „Baukasten“: begleiter.scss erzeugt figuren/begleiter.py, seite.html setzt Kapitelfarben und Kästen
    theme: [cosmo, begleiter.scss, theme.scss, zusatz.scss]
    include-after-body: seite.html
    code-copy: true
    code-link: true
    code-overflow: wrap
    code-tools: false
    toc: true
    toc-depth: 4
    toc-location: right
    toc-expand: false
    toc-title: "Auf dieser Seite"
    number-sections: true
    fig-align: center
    fig-cap-location: bottom
    smooth-scroll: true

execute:
  echo: true
  warning: false
  message: false
  freeze: auto

knitr:
  opts_chunk:
    dpi: 150
    fig.align: center
    out.width: "90%"

lang: de
